services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pricey-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Pricey API
      - DATABASE_URL=sqlite:////app/data/pricey.db
      - PRICE_CHECK_INTERVAL_MINUTES=60
      - SECRET_KEY=pricey-super-secret-key-production-change-me
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - EMAILS_FROM=noreply@pricey.local
    volumes:
      - pricey-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pricey-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pricey-data:
    driver: local
